name: Keep backend awake

on:
  schedule:
    # Runs every 10 minutes. GitHub may delay this slightly under load,
    # so this stays comfortably under Render's 15-minute sleep window.
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS https://ecommerce-backend-695l.onrender.com/health
